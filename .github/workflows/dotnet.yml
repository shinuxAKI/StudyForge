name: .NET

on:
  push:
    branches:
      - main
      - implementation/day-1-to-3
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore StudyForge.sln

      - name: Build
        run: dotnet build StudyForge.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test StudyForge.sln --no-build --configuration Release
